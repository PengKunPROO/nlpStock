plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.strategystock.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.strategystock.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        ndk {
            // 真机 arm64；如需模拟器调试，追加 "x86_64"
            abiFilters "arm64-v8a"
        }
        python {
            version "3.10"
            pip {
                // 与根 requirements.txt 保持一致（pydantic v1 是 Chaquopy 的硬约束）
                install "fastapi==0.115.14"
                install "pydantic==1.10.26"
                install "uvicorn==0.30.6"
                install "httpx==0.27.2"
                // 国内构建机：PyPI 直连慢/不稳，走阿里云镜像
                options "--index-url", "https://mirrors.aliyun.com/pypi/simple/"
            }
        }
    }

    sourceSets {
        main {
            python {
                // main.py 启动桥 + 由 preparePythonBackend 任务生成的 backend 包（保留包结构）
                // 注：不能直接把 srcDirs 指向 backend 目录——Chaquopy 会把其内容平铺到
                // import 根，导致 `import backend` 找不到包（ModuleNotFoundError）
                srcDirs = ["src/main/python", "build/python-backend"]
            }
            // 前端静态文件作为 assets 根（由 prepareFrontendAssets 任务生成，排除 dev/）
            assets.srcDirs += ["build/frontend-assets"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// 构建前把 frontend/（排除 dev/ 预览目录）拷进 assets 源目录
tasks.register('prepareFrontendAssets', Copy) {
    from("../../../frontend") { exclude "dev/**" }
    into("build/frontend-assets")
}

// 构建前把 backend/（排除 tests/）拷到 build/python-backend/backend，保留包结构供 `import backend`
tasks.register('preparePythonBackend', Copy) {
    from("../../../backend") { exclude "tests/**" }
    into("build/python-backend/backend")
}

preBuild.dependsOn 'prepareFrontendAssets', 'preparePythonBackend'

// merge*PythonSources 读取 build/python-backend（preparePythonBackend 的输出），
// Gradle 8 严格校验要求显式声明依赖（assets 的 prepareFrontendAssets 由 Android 插件隐式处理，Python 则需手动声明）
tasks.configureEach {
    if (name.startsWith('merge') && name.endsWith('PythonSources')) {
        dependsOn 'preparePythonBackend'
    }
}
